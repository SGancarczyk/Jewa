<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; }
        label { display: block; margin-bottom: 10px; }
        input { width: 100%; padding: 8px; margin-top: 2px; box-sizing: border-box; }
        button { padding: 10px 15px; margin-top: 10px; }
    </style>
</head>
<body>

<h2>Login</h2>

<form id="loginForm">
    <label>
        Username:
        <input type="text" name="username" required />
    </label>

    <label>
        Password:
        <input type="password" name="password" required />
    </label>

    <button type="submit">Login</button>
</form>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const data = {
            username: document.querySelector('input[name="username"]').value.trim(),
            password: document.querySelector('input[name="password"]').value
        };

        console.log("DEBUG: Sending payload:", data);

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (response.ok) {
                const result = await response.json();
                console.log("DEBUG: Server response:", result);

                alert("Login successful!");

                // store jwt
                localStorage.setItem("jwt", result.token);
            } else {
                const text = await response.text();
                console.error("DEBUG: Server error:", text);
                alert("Login failed: " + text);
            }
        } catch (err) {
            console.error("DEBUG: Fetch error:", err);
            alert("Error: " + err.message);
        }
    });
</script>

</body>
</html>

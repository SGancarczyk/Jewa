<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 400px; margin: 50px auto; }
        label { display: block; margin-bottom: 10px; }
        input { width: 100%; padding: 8px; margin-top: 2px; box-sizing: border-box; }
        button { padding: 10px 15px; margin-top: 10px; }
    </style>
</head>
<body>
<h2>Create Account</h2>
<form id="registerForm">
    <label>
        First Name:
        <input type="text" name="firstName" required />
    </label>
    <label>
        Last Name:
        <input type="text" name="lastName" required />
    </label>
    <label>
        Username:
        <input type="text" name="username" required />
    </label>
    <label>
        Email:
        <input type="email" name="email" required />
    </label>
    <label>
        Password:
        <input type="password" name="password" required />
    </label>
    <button type="submit">Register</button>
</form>

<script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        // Read all values from inputs
        const data = {
            firstName: document.querySelector('input[name="firstName"]').value.trim(),
            lastName: document.querySelector('input[name="lastName"]').value.trim(),
            username: document.querySelector('input[name="username"]').value.trim(),
            email: document.querySelector('input[name="email"]').value.trim(),
            password: document.querySelector('input[name="password"]').value
        };

        console.log("DEBUG: Sending payload:", data);

        try {
            const response = await fetch('/auth/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            // Check if the server responded with JSON
            if(response.ok) {
                const result = await response.json();
                console.log("DEBUG: Server response:", result);
                alert('Registration successful! You can now login.');

                // store jwt
                localStorage.setItem("jwt", result.token); // Redirect to login page
            } else {
                // If server returned an error, try to get the message
                const text = await response.text();
                console.error("DEBUG: Server error:", text);
                alert('Registration failed: ' + text);
            }
        } catch (err) {
            console.error("DEBUG: Fetch error:", err);
            alert('Error: ' + err.message);
        }
    });
</script>
</body>
</html>

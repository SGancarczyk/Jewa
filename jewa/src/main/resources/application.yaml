# MySQL Database
spring:
  application:
    name: jewa

  datasource:
    url: jdbc:mysql://localhost:3306/jewadb
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

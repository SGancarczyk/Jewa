# MySQL Database
spring:
  sql:
    init:
      mode: always
      data-locations: classpath:database_init/dummy_users.sql
  application:
    name: jewa

  datasource:
    url: jdbc:mysql://localhost:3306/jewadb
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    defer-datasource-initialization: true
    show-sql: true
    generate-ddl: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
